      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }

      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(8px); }
    }
    .animate-bounce-slow {
      animation: bounce-slow 2s infinite ease-in-out;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    html {
      scroll-behavior: smooth;
    }

  <!-- External React, ReactDOM, History, React Router v6.3.0 and Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/history@5/umd/history.development.js"></script>
  <script src="https://unpkg.com/react-router@6.3.0/umd/react-router.development.js"></script>
  <script src="https://unpkg.com/react-router-dom@6.3.0/umd/react-router-dom.development.js"></script>

</head>
<body class="bg-background text-primary antialiased font-body-md selection:bg-brand-clay selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { createRoot } = ReactDOM;
    const { MemoryRouter, Routes, Route, Link, useNavigate, useLocation } = ReactRouterDOM;

    // --- SHARED COMPONENTS ---
    const Header = () => {
      const [lang, setLang] = useState('EN');
      const [searchOpen, setSearchOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const location = useLocation();

      return (
        <header className="fixed top-0 left-0 w-full z-50 bg-[#1a1a1a]/85 backdrop-blur-md border-b border-white/10 px-6 lg:px-10 py-3.5 flex items-center justify-between whitespace-nowrap transition-all duration-300">
          {/* Navigation Links */}
          <nav className="flex-1 flex items-center gap-6 lg:gap-8">
            <Link 
              className={`text-xs sm:text-[13px] font-medium uppercase tracking-[0.12em] transition-all hover:text-white/80 ${location.pathname === '/' ? 'text-white border-b-2 border-white/80 pb-0.5' : 'text-neutral-300'}`} 
              to="/"
            >
              Home
            </Link>
            <Link 
              className={`text-xs sm:text-[13px] font-medium uppercase tracking-[0.12em] transition-all hover:text-white/80 ${location.pathname === '/story' ? 'text-white border-b-2 border-white/80 pb-0.5' : 'text-neutral-300'}`} 
              to="/story"
            >
              Kith Story
            </Link>
            <Link 
              className={`text-xs sm:text-[13px] font-medium uppercase tracking-[0.12em] transition-all hover:text-white/80 ${location.pathname === '/collections' ? 'text-white border-b-2 border-white/80 pb-0.5' : 'text-neutral-300'}`} 
              to="/collections"
            >
              Collections
            </Link>
            <Link 
              className={`text-xs sm:text-[13px] font-medium uppercase tracking-[0.12em] transition-all hover:text-white/80 ${location.pathname === '/contact' ? 'text-white border-b-2 border-white/80 pb-0.5' : 'text-neutral-300'}`} 
              to="/contact"
            >
              Contact Us
            </Link>
          </nav>

          {/* Logo */}
          <div className="flex-shrink-0">
            <Link className="font-display-lg text-2xl md:text-3xl tracking-tight text-white hover:opacity-90 transition-opacity" to="/">
              <img 
                alt="Kith Craft Logo" 
                className="h-10 md:h-12 w-auto object-cover rounded-xl" 
                src="https://lh3.googleusercontent.com/aida-public/AB6AXuA_xm_B1g6QbGyEVcHMwQUIlrKz3__hu5BXuWcMRIxrfnqqmAJa0Wmme8bAE_OxmY5CbvmHFu5_EkFxHq0h52ttEsMRxVFMEAoKWu7jCLirXGL64Lyv5d4tW_8G2GJBa_yuh83REb-aUkXEdelfvfk4vRTeUHNzwXFSV_kmJllTw1DTzmELIFwyZZAsGJu0usKvt18T3mNIN9YLolk5-8qNZtqMLmYrRxseLc40ys4lE4CTQp26YKuEYjvDW9BCAFYgZxTb4I5fJFQyDQ"
              />
            </Link>
          </div>

          {/* Utility Tools */}
          <div className="flex-1 flex items-center justify-end gap-3 lg:gap-6">
            {searchOpen ? (
              <div className="flex items-center bg-white/10 rounded-full px-3 py-1 border border-white/20">
                <input 
                  type="text" 
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Search craft..." 
                  className="bg-transparent border-none text-xs text-white placeholder-neutral-400 focus:outline-none focus:ring-0 p-0 w-28 sm:w-36"
                  autoFocus
                />
                <button onClick={() => setSearchOpen(false)} className="text-white ml-1 text-xs">✕</button>
              </div>
            ) : (
              <button 
                onClick={() => setSearchOpen(true)}
                aria-label="Search" 
                className="text-white hover:text-brand-bamboo transition-colors p-1"
              >
                <span className="material-symbols-outlined text-[20px]">search</span>
              </button>
            )}

            <div className="flex items-center">
              <button 
                onClick={() => setLang(lang === 'EN' ? 'TH' : 'EN')}
                className="text-xs sm:text-[13px] font-medium uppercase tracking-[0.12em] text-white px-3 border-x border-white/20 hover:text-white/80 transition-all"
              >
                {lang} / {lang === 'EN' ? 'TH' : 'EN'}
              </button>
            </div>

            <a 
              className="text-[10px] font-semibold uppercase tracking-widest text-white border border-white/80 rounded-full px-3.5 py-1.5 hover:bg-white hover:text-black transition-all shadow-sm" 
              href="https://facebook.com" 
              target="_blank" 
              rel="noreferrer"
            >
              ORDER ON FACEBOOK
            </a>

        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

            <div className="max-w-container-max mx-auto">
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-10 md:gap-8 mb-16">
                <div>
                  <h4 className="font-headline-sm text-[17px] font-semibold mb-4 text-on-primary">ABOUT KITH CRAFT</h4>
                  <p className="font-body-md text-sm text-inverse-on-surface/80 leading-relaxed mb-4">
                    Kith Craft brings together traditional Thai craftsmanship, upcycled genuine leather, and modern design. Every bag carries a story of community, dignity, and sustainable Thai creativity.
                  </p>
                </div>

                <div>
                  <h4 className="font-headline-sm text-[17px] font-semibold mb-4 text-on-primary">KITH CRAFT COLLECTIONS</h4>
                  <ul className="space-y-3 font-body-md text-sm text-inverse-on-surface/80">
                    <li><Link className="hover:text-brand-bamboo transition-colors" to="/collections">Shoulder Bags</Link></li>
                    <li><Link className="hover:text-brand-bamboo transition-colors" to="/collections">Embroidered Clutches</Link></li>
                    <li><Link className="hover:text-brand-bamboo transition-colors" to="/collections">Leather Wallets</Link></li>
                    <li><Link className="hover:text-brand-bamboo transition-colors" to="/collections">Eco Accessories</Link></li>
                    <li><Link className="hover:text-brand-bamboo transition-colors" to="/collections">Decorations & Home</Link></li>
                  </ul>
                </div>

                <div>
                  <h4 className="font-headline-sm text-[17px] font-semibold mb-4 text-on-primary">SERVICE POLICY</h4>
                  <ul className="space-y-3 font-body-md text-sm text-inverse-on-surface/80">
                    <li><a className="hover:text-brand-bamboo transition-colors" href="#faq">Material Information</a></li>
                    <li><a className="hover:text-brand-bamboo transition-colors" href="#faq">Shipping & Delivery</a></li>
                    <li><a className="hover:text-brand-bamboo transition-colors" href="#faq">Order & Payment</a></li>
                    <li><a className="hover:text-brand-bamboo transition-colors" href="#faq">Returns & Exchanges</a></li>
                    <li><Link className="hover:text-brand-bamboo transition-colors" to="/contact">FAQ & Support</Link></li>

                </div>

                <div>

                  <ul className="space-y-3 font-body-md text-sm text-inverse-on-surface/80">
                    <li className="flex items-start gap-3">
                      <span className="material-symbols-outlined text-[18px] text-brand-bamboo">storefront</span>
                      <span>123 Artisan Way, Chiang Mai, Thailand</span>
                    </li>
                    <li className="flex items-center gap-3">
                      <span className="material-symbols-outlined text-[18px] text-brand-bamboo">business</span>
                      <span>+66 123 456 789</span>
                    </li>
                    <li className="flex items-center gap-3">
                      <span className="material-symbols-outlined text-[18px] text-brand-bamboo">mail</span>
                      <a className="hover:text-brand-bamboo transition-colors" href="mailto:hello@kithcraft.com">hello@kithcraft.com</a>
                    </li>
                    <li className="flex items-center gap-3">
                      <span className="material-symbols-outlined text-[18px] text-brand-bamboo">work</span>
                      <Link className="hover:text-brand-bamboo transition-colors" to="/contact">Careers & Collabs</Link>
                    </li>
                  </ul>
                </div>
              </div>

              {/* Bottom Row */}
              <div className="border-t border-surface-tint/30 pt-8 flex flex-col md:flex-row justify-between items-center gap-6">
                <div>
                  <h2 className="font-display-lg text-2xl font-bold text-on-primary uppercase tracking-widest">KITH CRAFT</h2>
                  <p className="font-body-md text-xs text-inverse-on-surface/60 mt-1">© 2026 Kith Craft. All rights reserved. OTOP & SACIT Certified.</p>
                </div>

                <div className="flex items-center gap-4">
                  <span className="font-label-caps text-[11px] text-inverse-on-surface/70 uppercase tracking-widest hidden sm:inline">
                    รักธรรมชาติ = รักตัวเอง
                  </span>
                  <button 
                    aria-label="Scroll to top" 
                    onClick={scrollToTop}
                    className="w-10 h-10 rounded-full bg-surface-tint/30 flex items-center justify-center hover:bg-brand-bamboo hover:text-primary transition-colors text-on-primary"
                  >
                    <span className="material-symbols-outlined">arrow_upward</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </footer>
      );
    };

    const FaqSection = () => {
      const [openIndex, setOpenIndex] = useState(0);

      const faqs = [
        {
          q: "Are Kith Craft bags completely handmade?",
          a: "Yes, every Kith Craft piece is meticulously handcrafted by local Thai artisans. We take pride in preserving traditional techniques, particularly hand embroidery, ensuring each bag is unique."
        },
        {
          q: "What materials are used in your products?",
          a: "We prioritize sustainability by using upcycled genuine leather and other high-quality, eco-friendly materials sourced locally. Our products meet OTOP and SACIT standards for quality and durability."
        },
        {
          q: "Can I request a custom design?",
          a: "We occasionally accept custom orders depending on our artisans' availability and the complexity of the request. Please contact us directly via Facebook to discuss your ideas."
        },
        {
          q: "How do I care for my upcycled leather bag?",
          a: "Keep it away from prolonged direct sunlight and moisture. Clean gently with a soft, dry cloth. For deeper cleaning or conditioning, use products specifically designed for genuine leather."
        }
      ];

      return (

              {/* Image Grid */}

                  <div className="absolute inset-0 bg-cover bg-center transition-transform duration-700 group-hover:scale-105" style={{ backgroundImage: `url('https://lh3.googleusercontent.com/aida-public/AB6AXuBjs4ThthdK80GookptuOQymUoSh6icL7TWG5XGoQtWV1bUh711U18NszztsaH4HV0eMsHJlkQjqREFSsCxHpy5N1KvnnMLZZWBgq_mrFMDyoSV5id4ELTMlqgMxHdd7fCRoEHS3ll95EcZNc-zYYH-59z09j-3Kbs_I0rG1IpSzIF7jtpcWOCqni0Mkfm0koY9MBlz0h6hhfnQdSsxh2Zg0ZekMSCMAziuC7vt8MWKLqznN49R8OghH-Vw6WXfnmySYqsu_PKTKRV1zg')` }}></div>
                  <div className="absolute inset-0 bg-black/45 group-hover:bg-black/55 transition-colors"></div>
                  <div className="absolute inset-0 flex flex-col items-center justify-center p-4 text-center z-10 text-white">

                    <span className="inline-flex items-center gap-1 font-button text-xs text-white/90 group-hover:text-white">FIND OUT MORE <span className="material-symbols-outlined text-[16px]">arrow_forward</span></span>

                </div>

                <div className="group relative rounded-2xl overflow-hidden shadow-sm aspect-[4/3] block">
                  <div className="absolute inset-0 bg-cover bg-center transition-transform duration-700 group-hover:scale-105" style={{ backgroundImage: `url('https://lh3.googleusercontent.com/aida-public/AB6AXuBMiixyv9UTkpIjfsdcKyobQ_hk_jx7BlskLvYd_sD7YqjtDUbCFyNY9nBATAoW91igoJojD9CWZxR7s7LCWwPve8U0UFKZmDiTx3YhTpv-bdQFOqcBTlPFGCNskzugSGgg-NR4trUMLza8Tm26_yR2hv9tnZqCPMKLS-2aE7cErKjH7gZytmazJu7YpoQFEB7JVTPDA0xjlAIUkXrf71ZMRBIF8v7zVSuIplOmAMM4Yiniif0QmuwrpQ3n0jgnOVy_fpKTrVOI6OEynA')` }}></div>
                  <div className="absolute inset-0 bg-black/45 group-hover:bg-black/55 transition-colors"></div>
                  <div className="absolute inset-0 flex flex-col items-center justify-center p-4 text-center z-10 text-white">
                    <h3 className="font-headline-sm text-base uppercase mb-2">Shipping & Delivery</h3>
                    <span className="inline-flex items-center gap-1 font-button text-xs text-white/90 group-hover:text-white">FIND OUT MORE <span className="material-symbols-outlined text-[16px]">arrow_forward</span></span>
                  </div>
                </div>

                <div className="group relative rounded-2xl overflow-hidden shadow-sm aspect-[4/3] block">

                  <div className="absolute inset-0 bg-black/45 group-hover:bg-black/55 transition-colors"></div>
                  <div className="absolute inset-0 flex flex-col items-center justify-center p-4 text-center z-10 text-white">
                    <h3 className="font-headline-sm text-base uppercase mb-2">Order & Payment</h3>

                        />
                      </div>
                      <div className="flex flex-col gap-2">
                        <label className="font-label-caps text-xs text-secondary uppercase font-semibold">Email / Phone</label>
                        <input 
                          required
                          value={formData.contact}
                          onChange={(e) => setFormData({...formData, contact: e.target.value})}
                          className="w-full bg-surface-container-low border border-transparent rounded-xl p-3.5 text-sm focus:ring-1 focus:ring-brand-clay focus:border-brand-clay" 
                          placeholder="How can we reach you?" 
                          type="text" 
                        />
                      </div>
                    </div>

                    <div className="flex flex-col gap-2">
                      <label className="font-label-caps text-xs text-secondary uppercase font-semibold">Inquiry Type</label>
                      <select 
                        value={formData.type}
                        onChange={(e) => setFormData({...formData, type: e.target.value})}
                        className="w-full bg-surface-container-low border border-transparent rounded-xl p-3.5 text-sm focus:ring-1 focus:ring-brand-clay focus:border-brand-clay"
                      >
                        <option>Order Status</option>
                        <option>Custom Artisan Request</option>
                        <option>Upcycled Care</option>
                        <option>Wholesale & Press</option>
                      </select>
                    </div>

                    <div className="flex flex-col gap-2">
                      <label className="font-label-caps text-xs text-secondary uppercase font-semibold">Message</label>
                      <textarea 
                        required
                        value={formData.message}
                        onChange={(e) => setFormData({...formData, message: e.target.value})}
                        className="w-full bg-surface-container-low border border-transparent rounded-xl p-3.5 text-sm focus:ring-1 focus:ring-brand-clay focus:border-brand-clay" 
                        placeholder="Tell us more about your inquiry..." 
                        rows="5"
                      ></textarea>
                    </div>

                    <button 
                      className="bg-primary text-white px-8 py-3.5 rounded-full font-button text-xs uppercase tracking-wider hover:bg-brand-clay transition-colors duration-300 flex items-center gap-2 shadow-md" 
                      type="submit"
                    >
                      {formStatus === 'sending' ? 'SENDING...' : 'SEND MESSAGE'} 
                      <span className="material-symbols-outlined text-[16px]">arrow_forward</span>
                    </button>
                  </form>
                </div>

                {/* Studio Info Sidebar */}
                <div className="lg:col-span-5 bg-surface-container rounded-[32px] p-8 md:p-10 flex flex-col justify-between border border-secondary-fixed/50">
                  <div>
                    <span className="bg-brand-clay/10 text-brand-clay px-3 py-1 rounded-full font-label-caps text-xs tracking-wider mb-4 inline-block font-semibold">
                      STUDIO INFORMATION
                    </span>
                    <div className="space-y-6 mt-4">
                      <div>
                        <h4 className="font-label-caps text-xs text-secondary uppercase font-semibold mb-1">WORKING HOURS</h4>
                        <p className="font-body-lg text-sm text-primary">Mon – Sat: 9:00 AM – 6:00 PM (ICT)</p>
                      </div>
                      <div>
                        <h4 className="font-label-caps text-xs text-secondary uppercase font-semibold mb-1">RESPONSE TIME</h4>
                        <p className="font-body-lg text-sm text-primary">Within 24 hours</p>
                      </div>
                      <div>
                        <h4 className="font-label-caps text-xs text-secondary uppercase font-semibold mb-1">LOCATION & WORKSHOP</h4>
                        <p className="font-body-md text-sm text-primary">123 Artisan Way, Chiang Mai, Thailand</p>
                      </div>
                      <div>
                        <h4 className="font-label-caps text-xs text-secondary uppercase font-semibold mb-1">CERTIFICATIONS</h4>
                        <p className="font-body-md text-sm text-secondary">
                          Proudly meeting OTOP and SACIT standards for Thai artisanal excellence and ethical fair-trade sourcing.
                        </p>
                      </div>
                    </div>
                  </div>

                  <div className="pt-8 border-t border-outline-variant/30 mt-8">
                    <h3 className="font-display-lg text-xl text-brand-clay mb-2">รักธรรมชาติ = รักตัวเอง</h3>
                    <p className="font-body-md text-xs text-secondary italic leading-relaxed">
                      "To love nature is to love oneself. Our mission is to preserve Thai heritage through sustainable, upcycled craftsmanship."
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <FaqSection />
          <BentoGrid />
          <Footer />
        </div>
      );
    };

    // --- MAIN APP ROUTER CONTAINER ---
    const App = () => {
      return (
        <MemoryRouter initialEntries={["/"]}>
          <Routes>
            <Route path="/" element={<HomePage />} />
            <Route path="/story" element={<StoryPage />} />
            <Route path="/collections" element={<CollectionsPage />} />
            <Route path="/contact" element={<ContactPage />} />
            {/* Fallback route */}
            <Route path="*" element={<HomePage />} />
          </Routes>
        </MemoryRouter>
      );
    };

    // Mount Application
    const container = document.getElementById('root');
    const root = createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
